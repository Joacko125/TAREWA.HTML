[build]
  command = "npm run build"
  publish = "dist"

# Zunchos y planas se fusionaron en /productos/bandas-calefactoras.
# force = true: prioridad sobre la página de fallback que genera Astro por
# `redirects` (astro.config.mjs). Van antes del /catalogos/* para que las URLs
# viejas de /catalogos/ también lleguen directo, sin redirección en cadena.
[[redirects]]
  from = "/productos/resistencias-zuncho"
  to = "/productos/bandas-calefactoras"
  status = 301
  force = true

[[redirects]]
  from = "/productos/resistencias-zuncho/"
  to = "/productos/bandas-calefactoras"
  status = 301
  force = true

[[redirects]]
  from = "/productos/resistencias-planas"
  to = "/productos/bandas-calefactoras"
  status = 301
  force = true

[[redirects]]
  from = "/productos/resistencias-planas/"
  to = "/productos/bandas-calefactoras"
  status = 301
  force = true

[[redirects]]
  from = "/catalogos/resistencias-zuncho"
  to = "/productos/bandas-calefactoras"
  status = 301

[[redirects]]
  from = "/catalogos/resistencias-planas"
  to = "/productos/bandas-calefactoras"
  status = 301

# Caloventores SCIROCCO ya no tienen ficha propia: la URL que llegó a
# publicarse lleva directo al sitio de SCIROCCO.
[[redirects]]
  from = "/productos/caloventores-industriales"
  to = "https://scirocco.com.ar/"
  status = 301

[[redirects]]
  from = "/productos/caloventores-industriales/"
  to = "https://scirocco.com.ar/"
  status = 301

# Las páginas de producto se movieron de /catalogos/[slug] a /productos/[slug].
# Redirige las URLs viejas (solo subrutas; /catalogos sigue siendo la página de PDFs).
[[redirects]]
  from = "/catalogos/*"
  to = "/productos/:splat"
  status = 301

# /servicios se unificó dentro del index como sección #servicios.
# 301 real en el edge (force = true) para que tenga prioridad sobre la página
# de fallback que Astro genera por el campo `redirects` de astro.config.mjs.
[[redirects]]
  from = "/servicios"
  to = "/#servicios"
  status = 301
  force = true

[[redirects]]
  from = "/servicios/"
  to = "/#servicios"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
